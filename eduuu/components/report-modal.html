<!-- Report Card Modal (Multi-Section Generator) -->
    <div id="reportCardModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-xl font-bold text-gray-800">Student Academic Report Sheet</h3>
                <button onclick="closeReportCardModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div id="reportCardContent"></div>
            <div class="flex justify-end gap-3 pt-4 border-t mt-6">
                <button onclick="window.print()" class="px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg hover:bg-slate-900"><i class="fas fa-print mr-2"></i> Print Sheet</button>
                <button onclick="closeReportCardModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">Close</button>
            </div>
        </div>
    </div>
